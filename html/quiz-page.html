<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taking Test - French Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.3/dist/sweetalert2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="user-dashboard.html">
        <span class="fw-bold text-primary">FrenchQuiz</span>
      </a>
    </div>
  </nav>
  <div class="navbar-spacer"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="mb-4">
          <div class="d-flex justify-content-between mb-2">
            <span class="small text-muted">
              Question <span id="currentQuestion">1</span> of
              <span id="totalQuestions"></span>
            </span>
            <span class="small text-muted"><span id="progressPercent">0</span>% Complete</span>
          </div>
          <div class="progress" style="height: 8px">
            <div class="progress-bar bg-primary" role="progressbar" id="progressBar" style="width: 0%"></div>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-4" id="questionCard">
          <div class="card-body p-4">
            <div class="d-flex align-items-start mb-3">
              <span class="badge bg-primary me-2" id="questionNumber">Q1</span>
              <span class="badge bg-warning" id="requiredBadge" style="display: none">
                <i class="bi bi-asterisk me-1"></i>Required
              </span>
            </div>

            <h5 id="questionText" class="mb-3"></h5>

            <div id="radioOptionsContainer"></div>

            <div id="selectContainer" class="d-none mt-2">
              <select class="form-select form-select-lg" id="selectAnswer">
                <option value="">Choose an option</option>
              </select>
            </div>

            <div id="shortAnswerContainer" class="d-none mt-3">
              <input type="text" id="shortAnswerInput" class="form-control form-control-lg"
                placeholder="Type your answer here..." />
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between">
          <button class="btn btn-outline-secondary" id="prevBtn" disabled>
            <i class="bi bi-arrow-left me-2"></i>Previous
          </button>
          <button class="btn btn-primary" id="nextBtn">
            Next<i class="bi bi-arrow-right ms-2"></i>
          </button>
          <button class="btn btn-success d-none" id="submitBtn">
            <i class="bi bi-check-circle me-2"></i>Submit Test
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.3/dist/sweetalert2.all.min.js"></script>
  <script src="../js/user/quiz-page.js"></script>
</body>

</html>
