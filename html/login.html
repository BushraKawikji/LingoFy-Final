<!DOCTYPE html>



<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="login-card card shadow-lg border-0" style="max-width: 400px; width: 100%;">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-box-arrow-in-right text-primary" style="font-size: 3rem;"></i>

                    <h2 class="mt-3 fw-bold">Login</h2>

                    <p class="text-muted">Welcome back to LingoFy</p>

                </div>

                <form id="loginForm" novalidate>

                    <div class="mb-3">

                        <label for="username" class="form-label fw-semibold">Username</label>

                        <div class="input-group">

                            <span class="input-group-text"><i class="bi bi-person"></i></span>

                            <input type="text" class="form-control" id="username" name="username" required>

                        </div>

                        <div class="invalid-feedback d-none">

                            <i class="bi bi-exclamation-circle me-1"></i>Please enter your username

                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="loginPassword" class="form-label fw-semibold">Password</label>

                        <div class="input-group">

                            <span class="input-group-text"><i class="bi bi-lock"></i></span>

                            <input type="password" class="form-control" id="loginPassword" name="password" required>

                            <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                        <div class="invalid-feedback d-none">

                            <i class="bi bi-exclamation-circle me-1"></i>Please enter your password

                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">

                        <i class="bi bi-box-arrow-in-right me-2"></i>Login

                    </button>

                    <div class="text-center">

                        <p class="text-muted mb-0">Don't have an account? <a href="registeration.html"

                                class="text-primary fw-semibold">Register</a></p>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/shared/authentication/login.js"></script>

     

</body>

</html>
